{% load static %}

<!DOCTYPE html>
<html lang="fr">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>reset password</title>
        <link rel="stylesheet" href="{% static 'css/register.css' %}">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"/>
    </head>

    <body>
        <div class="register-container">
            <div class="register-card">
                <div class="col-md-4 reset-done-widget">
                    <p>Les instructions pour réinitialiser votre mot de passe ont été envoyées à votre adresse email.</p>
                    <br />
                    <p>Si vous n'avez rien reçu, assurez-vous que votre adresse email est la bonne et <span style="color: #b8892f;">n'oubliez pas de vérifier vos courriers indésirables (spam).</span></p>
                </div>
            </div>
        </div>
    </body>
</html>
