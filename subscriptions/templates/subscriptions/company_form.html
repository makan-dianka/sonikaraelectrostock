{% extends "layout/base.html" %}
{% load static %}

{% block head %}
<link rel="stylesheet" href="{% static 'css/subscriptions/forms.css' %}">
{% endblock %}

{% block content %}

<div class="form-page">

    <div class="card">

        <h1>🏢 {{ title }}</h1>

        <form method="post">

            {% csrf_token %}

            <div class="grid">

                {% for field in form %}

                    <div class="field">

                        <label>

                            {{ field.label }}

                        </label>

                        {{ field }}

                        {% if field.errors %}
                            <small class="error">

                                {{ field.errors.0 }}

                            </small>
                        {% endif %}

                    </div>

                {% endfor %}

            </div>

            <div class="buttons">

                <a href="{% url 'subscriptions:dashboard' %}" class="cancel">

                    Retour

                </a>

                <button>

                    Enregistrer

                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}
